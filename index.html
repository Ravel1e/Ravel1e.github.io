<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ravel1e ♡</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">

<script>
const ME = {

  github: "Ravel1e",

  name: "Ravel1e ♡",

  role: "WELCOME TO MY DIGITAL WORLD ✨",

  tagline: "I want to expand my knowledge of technology and become proficient in AI.💗🩵",

  about: "สวัสดี ยินดีต้อนรับเข้าสู่โลกของ Ravel1e 🌷 ที่นี่คือพื้นที่สำหรับรวบรวมผลงาน ความคิดสร้างสรรค์ และทุกสิ่งที่กำลังเรียนรู้และสร้างขึ้นมา ✨",

  learning: [
    "🌸 HTML และ CSS",
    "🩵 JavaScript",
    "🎀 Web Design",
    "✨ UI / UX Design",
    "🌷 Git และ GitHub"
  ],

  works: [
    {
      title: "My First Website 🌸",
      desc: "เว็บไซต์แรกที่สร้างและออกแบบด้วย HTML, CSS และ JavaScript",
      url: ""
    },
    {
      title: "Cute Portfolio 🎀",
      desc: "เว็บไซต์ Portfolio โทนชมพู ขาว และฟ้า",
      url: ""
    }
  ],

  links: [
    {
      label: "💻 GitHub",
      url: "https://github.com/Ravel1e"
    }
  ],

  theme: "cute"

};
</script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Pacifico&display=swap');

:root{
  --bg:#fff9fc;
  --line:#e8dce8;
  --text:#4c4650;
  --muted:#847988;

  --surface:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.70);

  --accent:#ff79ad;
  --accent-soft:#ff9bc4;

  --blue:#78ccef;
  --blue-soft:#d9f4ff;

  --pink-soft:#ffe1ed;

  --mono:"Kanit",sans-serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:"Kanit","Noto Sans Thai",sans-serif;

  line-height:1.75;

  background:
    radial-gradient(
      700px 450px at 5% 0%,
      rgba(255,183,213,.55),
      transparent 60%
    ),

    radial-gradient(
      700px 450px at 95% 10%,
      rgba(174,229,255,.60),
      transparent 60%
    ),

    radial-gradient(
      600px 400px at 50% 100%,
      rgba(255,213,232,.45),
      transparent 60%
    ),

    linear-gradient(
      135deg,
      #fff9fc,
      #f7fcff
    );
}

/* กล่องหลัก */

.wrap{
  max-width:850px;

  margin:0 auto;

  padding:0 22px 80px;
}

/* =====================
   HERO
===================== */

.hero{
  display:flex;

  gap:28px;

  align-items:center;

  padding:70px 0 15px;

  flex-wrap:wrap;

  animation:fadeUp .8s ease;
}

/* รูปโปรไฟล์ */

.avatar{
  width:125px;
  height:125px;

  border-radius:50%;

  object-fit:cover;

  flex-shrink:0;

  border:6px solid white;

  background:white;

  box-shadow:

    0 12px 30px rgba(255,120,170,.25),

    0 0 0 3px #ffd2e4,

    0 0 0 6px #c9efff;

  animation:float 4s ease-in-out infinite;
}

.avatar-fallback{
  width:125px;
  height:125px;

  border-radius:50%;

  flex-shrink:0;

  background:
    linear-gradient(
      135deg,
      #ffc9df,
      #c9efff
    );

  border:6px solid white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px;

  font-weight:700;

  color:#ff6fa8;

  box-shadow:

    0 12px 30px rgba(255,120,170,.25),

    0 0 0 3px #ffd2e4,

    0 0 0 6px #c9efff;
}

.hero-text{
  flex:1;

  min-width:240px;
}

.role{
  display:inline-block;

  margin:0 0 12px;

  padding:6px 16px;

  font-size:12px;

  letter-spacing:.1em;

  color:#ff5f9c;

  background:#ffe4ef;

  border-radius:999px;

  box-shadow:
    0 6px 18px rgba(255,120,170,.12);
}

h1{
  margin:0 0 8px;

  font-family:"Pacifico","Kanit",cursive;

  font-size:clamp(40px,7vw,62px);

  line-height:1.2;

  font-weight:400;

  background:
    linear-gradient(
      90deg,
      #ff70a9,
      #f7a5c8,
      #63bee8
    );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(
      0 5px 12px rgba(255,120,170,.15)
    );
}

.tagline{
  margin:0;

  font-size:clamp(17px,2.6vw,21px);

  color:#5f6470;
}

/* =====================
   ABOUT
===================== */

.about{
  margin:30px 0 0;

  max-width:100%;

  padding:22px 26px;

  color:#756b78;

  background:var(--glass);

  border:1px solid rgba(255,255,255,.9);

  border-radius:24px;

  box-shadow:
    0 15px 40px rgba(100,160,200,.10);

  backdrop-filter:blur(12px);

  animation:fadeUp 1s ease;
}

/* =====================
   BUTTONS
===================== */

.links{
  display:flex;

  flex-wrap:wrap;

  gap:12px;

  padding:0;

  margin:24px 0 0;

  list-style:none;
}

.links a{
  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:10px 22px;

  color:#ffffff;

  text-decoration:none;

  font-size:15px;

  font-weight:500;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ff82b4,
      #ff9fc8
    );

  box-shadow:
    0 8px 22px rgba(255,120,170,.22);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.links a:hover,
.links a:focus-visible{

  transform:
    translateY(-4px)
    scale(1.03);

  box-shadow:
    0 14px 30px rgba(255,120,170,.35);
}

/* =====================
   SECTION
===================== */

section{
  margin-top:58px;
}

h2{
  display:flex;

  align-items:center;

  gap:10px;

  margin:0 0 22px;

  padding-bottom:12px;

  font-size:15px;

  letter-spacing:.08em;

  color:#6b91b0;

  border-bottom:
    2px solid rgba(185,229,250,.7);
}

h2::before{
  content:"♡";

  color:#ff7eaf;

  font-size:24px;
}

/* =====================
   LEARNING
===================== */

.learning{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:14px;

  list-style:none;

  padding:0;

  margin:0;
}

.learning li{
  padding:15px 18px;

  color:#706775;

  background:rgba(255,255,255,.78);

  border:
    1px solid rgba(255,255,255,.9);

  border-radius:18px;

  box-shadow:
    0 8px 25px rgba(100,160,200,.08);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.learning li:hover{

  transform:
    translateY(-5px);

  box-shadow:
    0 15px 30px rgba(255,120,170,.16);
}

/* =====================
   WORKS
===================== */

.works{
  display:grid;

  gap:18px;

  grid-template-columns:
    repeat(auto-fill,minmax(240px,1fr));
}

.work{
  position:relative;

  overflow:hidden;

  padding:22px;

  background:rgba(255,255,255,.82);

  border:
    1px solid rgba(255,255,255,.9);

  border-radius:22px;

  box-shadow:
    0 10px 30px rgba(100,160,200,.09);

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.work::before{
  content:"";

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:6px;

  background:
    linear-gradient(
      90deg,
      #ff9ac2,
      #ffd0e2,
      #a9e3ff
    );
}

.work:hover{

  transform:
    translateY(-7px);

  box-shadow:
    0 20px 40px rgba(255,120,170,.15);
}

.work h3{
  margin:0 0 8px;

  font-size:19px;

  color:#ff6fa8;
}

.work p{
  margin:0;

  color:#7d7480;

  font-size:14.5px;
}

.work a{
  display:inline-block;

  margin-top:12px;

  color:#5caed6;

  text-decoration:none;

  font-weight:600;
}

.work a:hover{
  color:#ff6fa8;
}

/* ไม่มีผลงาน */

.empty{
  padding:30px 20px;

  color:#897e8b;

  text-align:center;

  background:rgba(255,255,255,.6);

  border:
    2px dashed #ffc6dd;

  border-radius:22px;
}

/* =====================
   NETWORK PANEL
===================== */

.panel{
  padding:8px 22px 20px;

  background:rgba(255,255,255,.72);

  border:
    1px solid rgba(255,255,255,.9);

  border-radius:22px;

  box-shadow:
    0 10px 30px rgba(100,160,200,.08);
}

.row{
  display:grid;

  grid-template-columns:
    minmax(130px,1fr)
    minmax(0,1.5fr);

  gap:14px;

  padding:15px 0;

  border-bottom:
    1px dashed #dcebf3;
}

.row:last-of-type{
  border-bottom:0;
}

.row dt{
  color:#8795a1;

  font-size:14px;

  margin:0;
}

.row dd{
  margin:0;

  font-family:"Kanit",sans-serif;

  font-size:14px;

  color:#ff72a9;

  word-break:break-all;
}

.row .note{
  display:block;

  margin-top:5px;

  color:#918794;

  font-size:12.5px;
}

.hint{
  margin:15px 0 0;

  padding:12px 15px;

  color:#76818a;

  font-size:14px;

  background:#eefaff;

  border-radius:14px;
}

/* =====================
   FOOTER
===================== */

footer{
  margin-top:60px;

  padding-top:28px;

  text-align:center;

  border-top:
    1px solid #dcebf3;

  color:#8c828d;

  font-size:14px;
}

footer::before{
  content:"💗 🩵 🤍";

  display:block;

  margin-bottom:8px;

  font-size:20px;
}

footer a{
  color:#ff70a9;
}

/* =====================
   ANIMATION
===================== */

@keyframes float{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =====================
   MOBILE
===================== */

@media (max-width:520px){

  .wrap{
    padding:0 16px 70px;
  }

  .hero{
    padding-top:45px;

    gap:18px;

    justify-content:center;

    text-align:center;
  }

  .hero-text{
    min-width:100%;
  }

  .role{
    font-size:10px;
  }

  .avatar,
  .avatar-fallback{
    width:100px;
    height:100px;
    font-size:38px;
  }

  .links{
    justify-content:center;
  }

  .row{
    grid-template-columns:1fr;

    gap:3px;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <header class="hero">

    <img
      class="avatar"
      id="avatar"
      alt=""
      width="125"
      height="125"
    >

    <div class="hero-text">

      <p class="role" id="role"></p>

      <h1 id="name"></h1>

      <p class="tagline" id="tagline"></p>

    </div>

  </header>


  <p class="about" id="about"></p>


  <ul class="links" id="links"></ul>


  <section>

    <h2>กำลังเรียนรู้</h2>

    <ul
      class="learning"
      id="learning">
    </ul>

  </section>


  <section>

    <h2>ผลงานของฉัน</h2>

    <div
      class="works"
      id="works">
    </div>

  </section>


  <section>

    <h2>ข้อมูลการเชื่อมต่อ</h2>

    <div class="panel">

      <dl id="netpanel"></dl>

      <p class="hint">
        ✨ ข้อมูลเหล่านี้วัดจากการโหลดหน้าเว็บจริง
      </p>

    </div>

  </section>


  <footer>

    สร้างด้วย HTML, CSS และ JavaScript ·

    <a
      id="repolink"
      href="https://github.com">

      ดูซอร์สโค้ดของ Ravel1e

    </a>

  </footer>

</div>


<script>

const $ = (id) =>
  document.getElementById(id);


/* แสดงข้อมูล */

document.title = ME.name;

$('role').textContent =
  ME.role;

$('name').textContent =
  ME.name;

$('tagline').textContent =
  ME.tagline;

$('about').textContent =
  ME.about;


/* รูปโปรไฟล์จาก GitHub */

const avatar = $('avatar');

avatar.alt =
  'รูปโปรไฟล์ของ ' + ME.name;


avatar.addEventListener(
  'error',
  () => {

    const box =
      document.createElement('div');

    box.className =
      'avatar-fallback';

    box.setAttribute(
      'aria-hidden',
      'true'
    );

    box.textContent =
      (ME.name || '?')
      .trim()
      .charAt(0);

    avatar.replaceWith(box);

  }
);


avatar.src =
  'https://github.com/' +
  ME.github +
  '.png?size=256';


/* รายการสิ่งที่กำลังเรียนรู้ */

for (
  const item of ME.learning || []
){

  const li =
    document.createElement('li');

  li.textContent = item;

  $('learning')
    .appendChild(li);

}


/* ปุ่มลิงก์ */

for (
  const link of ME.links || []
){

  const a =
    document.createElement('a');

  a.href =
    link.url;

  a.textContent =
    link.label;

  a.target =
    '_blank';

  a.rel =
    'noopener noreferrer';


  const li =
    document.createElement('li');

  li.appendChild(a);


  $('links')
    .appendChild(li);

}


/* ผลงาน */

if (
  !ME.works ||
  ME.works.length === 0
){

  const box =
    document.createElement('div');

  box.className =
    'empty';

  box.textContent =
    '🌷 ยังไม่มีผลงานในตอนนี้ แต่กำลังสร้างสิ่งใหม่ ๆ อยู่ ✨';

  $('works')
    .appendChild(box);

}
else{

  for (
    const w of ME.works
  ){

    const card =
      document.createElement('div');

    card.className =
      'work';


    const h3 =
      document.createElement('h3');

    h3.textContent =
      w.title;


    const p =
      document.createElement('p');

    p.textContent =
      w.desc;


    card.append(
      h3,
      p
    );


    if(w.url){

      const a =
        document.createElement('a');

      a.href =
        w.url;

      a.textContent =
        'ดูผลงาน ↗';

      a.target =
        '_blank';

      a.rel =
        'noopener noreferrer';

      card.appendChild(a);

    }


    $('works')
      .appendChild(card);

  }

}


/* GitHub Repository */

$('repolink').href =
  'https://github.com/' +
  ME.github;


/* ข้อมูล Network */

function ms(v){

  if(
    typeof v !== 'number' ||
    v < 0 ||
    Number.isNaN(v)
  ){
    return '—';
  }

  return Math.round(v) + ' ms';

}


window.addEventListener(
  'load',

  () => setTimeout(() => {

    const nav =
      performance
      .getEntriesByType(
        'navigation'
      )[0];


    const rows = [

      [
        '🌐 Domain name',

        location.hostname ||
        '(เปิดจากไฟล์ในเครื่อง)',

        'ชื่อโดเมนของหน้าเว็บ'
      ],

      [
        '🔒 Protocol',

        location.protocol,

        'รูปแบบการเชื่อมต่อที่ใช้งาน'
      ]

    ];


    if(nav){

      rows.push(

        [
          '⚡ HTTP version',

          nav.nextHopProtocol || '—',

          'เวอร์ชัน HTTP ที่ใช้'
        ],

        [
          '🩵 DNS lookup',

          ms(
            nav.domainLookupEnd -
            nav.domainLookupStart
          ),

          'เวลาค้นหาที่อยู่ของโดเมน'
        ],

        [
          '💗 Connection + TLS',

          ms(
            nav.connectEnd -
            nav.connectStart
          ),

          'เวลาสร้างการเชื่อมต่อ'
        ],

        [
          '✨ TTFB',

          ms(
            nav.responseStart -
            nav.requestStart
          ),

          'เวลารอข้อมูลแรกจากเซิร์ฟเวอร์'
        ]

      );

    }


    for(
      const [label,value,note]
      of rows
    ){

      const row =
        document.createElement('div');

      row.className =
        'row';


      const dt =
        document.createElement('dt');

      dt.textContent =
        label;


      const dd =
        document.createElement('dd');

      dd.textContent =
        value;


      const small =
        document.createElement('span');

      small.className =
        'note';

      small.textContent =
        note;


      dd.appendChild(small);

      row.append(
        dt,
        dd
      );


      $('netpanel')
        .appendChild(row);

    }

  },0)

);

</script>

</body>
</html>
